name: CI/CD with test case

on:
  push:
    branches:
      - main

jobs:
  build-test:
    name: Dev & Test Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirement.txt

      - name: Run dev script
        run: python dev.py

      - name: Run test cases
        run: pytest test/test_calculator.py
